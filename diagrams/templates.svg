<polygon points="212.0,588.0 228.0,588.0 220.0,618.0" fill="#4A9BE0" stroke="#0B5CAD" stroke-width="1" stroke-linejoin="round" opacity="1"/>
<text x="30.0" y="548.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">G  Guard comb</text>
<text x="30.0" y="636.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">100 mm · base 16 mm · 10 teeth 15 mm long</text>
<text x="30.0" y="651.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">dashed line: spacer strip (100 × 8 mm) goes here</text>
