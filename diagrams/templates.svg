<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" role="img" aria-label="Cutting templates with dimensions for every part">
<title>Cutting templates with dimensions for every part</title>
<defs></defs>
<rect x="1.0" y="1.0" width="898.0" height="688.0" rx="14" fill="#FBF8F0" stroke="#DDD5C2" stroke-width="2" opacity="1"/>
<text x="30.0" y="34.0" font-size="15" font-weight="700" fill="#1B2A4A" text-anchor="start">Foam board (5 mm) — cut with a craft knife and steel ruler (grown-up job)</text>
<rect x="30.0" y="70.0" width="280.0" height="200.0" rx="0" fill="#FFFFFF" stroke="#555555" stroke-width="1.8" opacity="1"/>
<text x="30.0" y="62.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">A  Base plate</text>
<text x="170.0" y="175.0" font-size="12" font-weight="400" fill="#5A6673" text-anchor="middle">140 × 100 mm</text>
<rect x="340.0" y="70.0" width="280.0" height="80.0" rx="0" fill="#FFFFFF" stroke="#555555" stroke-width="1.8" opacity="1"/>
<text x="340.0" y="62.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">B  Side plates — cut 2</text>
<text x="480.0" y="115.0" font-size="12" font-weight="400" fill="#5A6673" text-anchor="middle">140 × 40 mm</text>
<circle cx="410.0" cy="130.0" r="5.0" fill="#FBF8F0" stroke="#555555" stroke-width="1.5" opacity="1"/>
<circle cx="560.0" cy="130.0" r="5.0" fill="#FBF8F0" stroke="#555555" stroke-width="1.5" opacity="1"/>
<text x="340.0" y="170.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">Ø 5 mm straw holes, 10 mm up, 35 &amp; 110 mm from the front</text>
<rect x="650.0" y="70.0" width="220.0" height="40.0" rx="0" fill="#FFFFFF" stroke="#555555" stroke-width="1.8" opacity="1"/>
<text x="650.0" y="62.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">C  Header arms — cut 2</text>
<circle cx="666.0" cy="90.0" r="4.0" fill="#FBF8F0" stroke="#555555" stroke-width="1.5" opacity="1"/>
<circle cx="686.0" cy="90.0" r="4.0" fill="#FBF8F0" stroke="#555555" stroke-width="1.5" opacity="1"/>
<circle cx="842.0" cy="90.0" r="4.0" fill="#FBF8F0" stroke="#555555" stroke-width="1.5" opacity="1"/>
<text x="650.0" y="128.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">110 × 20 mm · Ø 4 mm holes at</text>
<text x="650.0" y="143.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">8 &amp; 18 mm (pins), 96 mm (reel)</text>
<rect x="30.0" y="340.0" width="320.0" height="60.0" rx="0" fill="#FFFFFF" stroke="#555555" stroke-width="1.8" opacity="1"/>
<text x="30.0" y="332.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">D  Cutter mount plate</text>
<text x="190.0" y="375.0" font-size="12" font-weight="400" fill="#5A6673" text-anchor="middle">160 × 30 mm</text>
<rect x="312.0" y="360.0" width="24.0" height="20.0" rx="0" fill="none" stroke="#9C7610" stroke-width="1.5" opacity="1" stroke-dasharray="4 3"/>
