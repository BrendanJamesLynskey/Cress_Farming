<text x="300.0" y="618.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">112 mm · base 6 mm · 10 teeth 12 mm long</text>
<text x="300.0" y="633.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">Ø 3 mm pin hole 5 mm from the long end</text>
