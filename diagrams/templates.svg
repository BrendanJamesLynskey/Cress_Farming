<text x="760.0" y="636.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">Ø 20 mm disc, pin hole</text>
<text x="760.0" y="651.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">5 mm off centre</text>
<line x1="650.0" y1="262.0" x2="750.0" y2="262.0" stroke="#1B2A4A" stroke-width="3" stroke-linecap="butt" opacity="1"/>
