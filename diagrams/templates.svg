<text x="30.0" y="418.0" font-size="11.5" font-weight="600" fill="#9C7610" text-anchor="start">Ø 5 mm shaft hole: 147 mm from the left,</text>
<text x="30.0" y="433.0" font-size="11.5" font-weight="600" fill="#9C7610" text-anchor="start">15 mm from the back; motor in the dashed box</text>
<rect x="380.0" y="340.0" width="180.0" height="80.0" rx="0" fill="#FFF4D6" stroke="#C98A00" stroke-width="1.8" opacity="1"/>
