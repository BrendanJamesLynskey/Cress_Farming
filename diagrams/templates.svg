<text x="470.0" y="385.0" font-size="12" font-weight="400" fill="#5A6673" text-anchor="middle">90 × 40 mm</text>
<rect x="600.0" y="340.0" width="170.0" height="30.0" rx="0" fill="#F6DDF1" stroke="#B5179E" stroke-width="1.8" opacity="1"/>
<text x="600.0" y="332.0" font-size="13.5" font-weight="700" fill="#1B2A4A" text-anchor="start">F  Reel paddles — cut 4</text>
<text x="685.0" y="362.0" font-size="11" font-weight="400" fill="#5A6673" text-anchor="middle">85 × 15</text>
<circle cx="810.0" cy="355.0" r="20.0" fill="#F6DDF1" stroke="#B5179E" stroke-width="1.8" opacity="1"/>
<circle cx="856.0" cy="355.0" r="20.0" fill="#F6DDF1" stroke="#B5179E" stroke-width="1.8" opacity="1"/>
<text x="833.0" y="398.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="middle">Reel hubs Ø 20 × 2</text>
<text x="380.0" y="452.0" font-size="12.5" font-weight="700" fill="#1B2A4A" text-anchor="start">K  Tank: a small plastic tub about 90 × 50 mm, front wall cut down</text>
<text x="380.0" y="469.0" font-size="12" font-weight="400" fill="#5A6673" text-anchor="start">to 8 mm so the ramp can tip cress in (a dustpan shape)</text>
<text x="30.0" y="522.0" font-size="15" font-weight="700" fill="#1B2A4A" text-anchor="start">Stiff plastic, 1 mm (e.g. a ring-binder cover) — strong scissors are fine</text>
