<text x="580.0" y="616.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">45 mm of lolly stick,</text>
<text x="580.0" y="631.0" font-size="11.5" font-weight="400" fill="#5A6673" text-anchor="start">holes 35 mm apart</text>
<circle cx="800.0" cy="596.0" r="20.0" fill="#F77F00" stroke="#B85C00" stroke-width="2" opacity="1"/>
